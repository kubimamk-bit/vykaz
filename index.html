<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16243F">
<title>Denní výkaz — Morava House</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===================================================================
   JEDINÉ, CO SE TU UPRAVUJE, JE ADRESA V SOUBORU NÍŽE (ENDPOINT).
   =================================================================== */
:root{
  --ink:#16243F; --ink2:#42506B; --ink3:#77839B;
  --bg:#EEF1F6; --card:#FFFFFF; --line:#D5DCE7;
  --brand:#2C5BD1; --brand-dark:#1E43A0;
  --ok:#17795A; --ok-bg:#DFF3EA;
  --warn:#8A5A00; --warn-bg:#FDF0D5;
  --err:#A32B1C; --err-bg:#FBE5E1;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.45}
body{padding:0 0 40px; padding-top:env(safe-area-inset-top)}

header{background:var(--ink); color:#fff; padding:14px 18px 16px;}
.hrow{display:flex; align-items:center; justify-content:space-between; gap:12px;}
h1{margin:0; font-size:19px; font-weight:650; letter-spacing:-.01em}
.sub{margin:2px 0 0; font-size:12.5px; color:#A9B6D0}
.langs{display:flex; gap:6px}
.langs button{background:rgba(255,255,255,.12); color:#fff; border:0; border-radius:999px;
  padding:6px 11px; font-size:12.5px; font-weight:600; cursor:pointer}
.langs button[aria-pressed="true"]{background:#fff; color:var(--ink)}

main{max-width:560px; margin:0 auto; padding:16px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:16px; margin-bottom:14px}

label{display:block; font-size:13px; font-weight:650; color:var(--ink2);
  text-transform:uppercase; letter-spacing:.05em; margin:0 0 7px}
.field{margin-bottom:18px}
select,input[type="date"],input[type="number"],textarea{
  width:100%; font:inherit; font-size:17px; color:var(--ink); background:#fff;
  border:1.5px solid var(--line); border-radius:10px; padding:13px 12px; appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='%2377839B' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat; background-position:right 10px center; padding-right:40px}
select:focus,input:focus,textarea:focus{outline:3px solid #BCD0FA; border-color:var(--brand)}
textarea{min-height:76px; resize:vertical}

.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:9px}
.chip{border:1.5px solid var(--line); background:#fff; color:var(--ink2);
  border-radius:999px; padding:9px 14px; font-size:15px; font-weight:600; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:#fff}

button.go{width:100%; border:0; border-radius:12px; background:var(--brand); color:#fff;
  font:inherit; font-size:18px; font-weight:700; padding:17px; cursor:pointer}
button.go:active{background:var(--brand-dark)}
button.go[disabled]{opacity:.55}
button.ghost{width:100%; border:1.5px solid var(--line); background:#fff; color:var(--ink);
  border-radius:12px; font:inherit; font-size:16px; font-weight:650; padding:14px; cursor:pointer; margin-top:10px}

.note{font-size:13.5px; color:var(--ink3); margin:10px 2px 0}
.banner{border-radius:10px; padding:12px 14px; font-size:15px; margin-bottom:14px; display:none}
.banner.on{display:block}
.banner.ok{background:var(--ok-bg); color:var(--ok); border:1px solid #A9DCC6}
.banner.warn{background:var(--warn-bg); color:var(--warn); border:1px solid #EACB8A}
.banner.err{background:var(--err-bg); color:var(--err); border:1px solid #EFB6AC}

.done{text-align:center; padding:26px 16px}
.done .tick{width:62px; height:62px; border-radius:50%; background:var(--ok-bg); color:var(--ok);
  display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:34px; font-weight:700}
.done h2{margin:0 0 6px; font-size:21px}
.done p{margin:0 0 20px; color:var(--ink2); font-size:15px}
.hide{display:none !important}
@media (prefers-reduced-motion:no-preference){
  .done .tick{animation:pop .28s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <h1 id="t-title">Denní výkaz</h1>
      <p class="sub">Morava House</p>
    </div>
    <div class="langs" role="group">
      <button type="button" data-lang="cs" aria-pressed="true">CZ</button>
      <button type="button" data-lang="uk" aria-pressed="false">UA</button>
    </div>
  </div>
</header>

<main>
  <div id="bnOffline" class="banner warn"></div>
  <div id="bnErr" class="banner err"></div>

  <section id="formCard" class="card">
    <div class="field">
      <label id="t-who" for="prac">Kdo jsi</label>
      <select id="prac"></select>
    </div>

    <div class="field">
      <label id="t-date" for="datum">Datum</label>
      <input type="date" id="datum">
      <div class="chips">
        <button type="button" class="chip" id="chDnes">Dnes</button>
        <button type="button" class="chip" id="chVcera">Včera</button>
      </div>
    </div>

    <div class="field">
      <label id="t-site" for="stavba">Stavba</label>
      <select id="stavba"></select>
    </div>

    <div class="field">
      <label id="t-work" for="prace">Co jsi dělal</label>
      <select id="prace"></select>
    </div>

    <div class="field">
      <label id="t-hours" for="hodiny">Hodiny</label>
      <select id="hodiny"></select>
    </div>

    <div class="field">
      <label id="t-note" for="pozn">Poznámka</label>
      <textarea id="pozn" rows="2"></textarea>
    </div>

    <button class="go" id="send" type="button">Odeslat výkaz</button>
    <p class="note" id="t-hint">Byl jsi na dvou stavbách? Odešli výkaz dvakrát.</p>
  </section>

  <section id="doneCard" class="card done hide">
    <div class="tick">✓</div>
    <h2 id="t-done">Zapsáno</h2>
    <p id="doneInfo"></p>
    <button class="go" id="again" type="button">Přidat další stavbu</button>
    <button class="ghost" id="close" type="button">Hotovo</button>
  </section>
</main>

<script>
/* ===================================================================
   SEM VLOŽ ADRESU WEBOVÉ APLIKACE Z APPS SCRIPTU (končí na /exec)
   =================================================================== */
const ENDPOINT = "SEM_VLOZ_ADRESU_KONCICI_NA_EXEC";

/* ------------------------------------------------------------------ */
const T = {
  cs:{title:"Denní výkaz",who:"Kdo jsi",date:"Datum",site:"Stavba",work:"Co jsi dělal",
      hours:"Hodiny",note:"Poznámka (nepovinné)",send:"Odeslat výkaz",
      hint:"Byl jsi na dvou stavbách? Odešli výkaz dvakrát.",
      done:"Zapsáno",again:"Přidat další stavbu",close:"Hotovo",today:"Dnes",yday:"Včera",
      sending:"Odesílám…",
      offline:n=>`Nemáš signál. Výkazů čeká na odeslání: ${n}. Odešlou se samy, až se připojíš.`,
      queued:"Uloženo do telefonu. Odešle se samo, až chytíš signál.",
      errFill:"Vyplň všechna pole.",
      errHours:"Hodiny musí být mezi 0,5 a 24.",
      errLoad:"Nepodařilo se načíst seznamy. Zkus to za chvíli znovu."},
  uk:{title:"Денний звіт",who:"Хто ти",date:"Дата",site:"Будівництво",work:"Що ти робив",
      hours:"Години",note:"Примітка (необов'язково)",send:"Надіслати звіт",
      hint:"Був на двох будівництвах? Надішли звіт двічі.",
      done:"Записано",again:"Додати ще будівництво",close:"Готово",today:"Сьогодні",yday:"Вчора",
      sending:"Надсилаю…",
      offline:n=>`Немає зв'язку. Звітів в черзі: ${n}. Надішлються самі, коли буде мережа.`,
      queued:"Збережено в телефоні. Надішлеться, коли буде зв'язок.",
      errFill:"Заповни всі поля.",
      errHours:"Години мають бути від 0,5 до 24.",
      errLoad:"Не вдалося завантажити списки. Спробуй пізніше."}
};

const K = {lang:"mh_lang", ciselniky:"mh_ciselniky", fronta:"mh_fronta",
           kdo:"mh_kdo", stavba:"mh_stavba"};
const $ = id => document.getElementById(id);
let lang = ls(K.lang) || "cs";
if(!T[lang]) { lang = "cs"; ls(K.lang, lang); }

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k);
  localStorage.setItem(k,v); }catch(e){ return null; } }
function lsj(k,v){ try{ if(v===undefined){const s=localStorage.getItem(k);return s?JSON.parse(s):null;}
  localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }

function uuid(){
  try{ if(crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return "z-"+Date.now()+"-"+Math.random().toString(36).slice(2,10);
}

/* ---------- jazyk ---------- */
function prelozit(){
  const t = T[lang];
  $("t-title").textContent = t.title;  document.title = t.title + " — Morava House";
  $("t-who").textContent = t.who;      $("t-date").textContent = t.date;
  $("t-site").textContent = t.site;    $("t-work").textContent = t.work;
  $("t-hours").textContent = t.hours;  $("t-note").textContent = t.note;
  $("send").textContent = t.send;      $("t-hint").textContent = t.hint;
  $("t-done").textContent = t.done;    $("again").textContent = t.again;
  $("close").textContent = t.close;
  $("chDnes").textContent = t.today;   $("chVcera").textContent = t.yday;
  document.documentElement.lang = lang;
  ukazFrontu();
}
document.querySelectorAll(".langs button").forEach(b=>{
  b.addEventListener("click",()=>{
    lang = b.dataset.lang; ls(K.lang, lang);
    document.querySelectorAll(".langs button").forEach(x=>
      x.setAttribute("aria-pressed", String(x===b)));
    prelozit();
  });
  if(b.dataset.lang===lang) b.setAttribute("aria-pressed","true");
  else b.setAttribute("aria-pressed","false");
});

/* ---------- číselníky ---------- */
function naplnit(sel, pole, zapamatovane){
  sel.innerHTML = "";
  const prazdny = document.createElement("option");
  prazdny.value = ""; prazdny.textContent = "—";
  sel.appendChild(prazdny);
  pole.forEach(v=>{
    const o = document.createElement("option");
    o.value = v; o.textContent = v; sel.appendChild(o);
  });
  if(zapamatovane && pole.indexOf(zapamatovane)>=0) sel.value = zapamatovane;
}

function pouzitCiselniky(c){
  naplnit($("prac"), c.lide || [], ls(K.kdo));
  naplnit($("stavba"), c.zakazky || [], ls(K.stavba));
  naplnit($("prace"), c.prace || []);
}

async function nacistCiselniky(){
  const ulozene = lsj(K.ciselniky);
  if(ulozene) pouzitCiselniky(ulozene);
  try{
    const r = await fetch(ENDPOINT, {method:"GET"});
    const c = await r.json();
    if(c && c.ok){ lsj(K.ciselniky, c); pouzitCiselniky(c); skryt("bnErr"); }
  }catch(e){
    if(!ulozene) ukazat("bnErr", T[lang].errLoad);
  }
}

/* ---------- hodiny: 0,5 až 16 po půlhodinách ---------- */
(function naplnitHodiny(){
  const sel = $("hodiny");
  const prazdny = document.createElement("option");
  prazdny.value = ""; prazdny.textContent = "—";
  sel.appendChild(prazdny);
  for(let h = 0.5; h <= 16.0001; h += 0.5){
    const v = Math.round(h * 2) / 2;
    const o = document.createElement("option");
    o.value = String(v);
    o.textContent = String(v).replace(".", ",") + " h";
    sel.appendChild(o);
  }
})();

/* ---------- datum ---------- */
function isoDen(posun){
  const d = new Date(); d.setDate(d.getDate() + (posun||0));
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
$("datum").value = isoDen(0);
$("chDnes").addEventListener("click", ()=>{ $("datum").value = isoDen(0); });
$("chVcera").addEventListener("click", ()=>{ $("datum").value = isoDen(-1); });

/* ---------- bannery ---------- */
function ukazat(id, text){ const e=$(id); e.textContent=text; e.classList.add("on"); }
function skryt(id){ $(id).classList.remove("on"); }

function ukazFrontu(){
  const f = lsj(K.fronta) || [];
  if(f.length) ukazat("bnOffline", T[lang].offline(f.length));
  else skryt("bnOffline");
}

/* ---------- odeslání ---------- */
async function poslat(zaznam){
  const r = await fetch(ENDPOINT, {method:"POST", body: JSON.stringify(zaznam)});
  const o = await r.json();
  if(!o || !o.ok) throw new Error(o && o.chyba ? o.chyba : "Server odmítl zápis.");
  return o;
}

async function odeslatFrontu(){
  let f = lsj(K.fronta) || [];
  if(!f.length) return;
  const zbytek = [];
  for(const z of f){
    try{ await poslat(z); }catch(e){ zbytek.push(z); }
  }
  lsj(K.fronta, zbytek);
  ukazFrontu();
}

$("send").addEventListener("click", async ()=>{
  const t = T[lang];
  const z = {
    id: uuid(),
    pracovnik: $("prac").value,
    datum: $("datum").value,
    stavba: $("stavba").value,
    prace: $("prace").value,
    hodiny: $("hodiny").value,
    poznamka: $("pozn").value,
    jazyk: lang,
    zarizeni: (navigator.userAgent||"").slice(0,120)
  };

  skryt("bnErr");
  if(!z.pracovnik || !z.stavba || !z.prace || !z.datum || !z.hodiny){
    ukazat("bnErr", t.errFill); window.scrollTo({top:0,behavior:"smooth"}); return;
  }
  const h = parseFloat(String(z.hodiny).replace(",","."));
  if(!(h>=0.5) || h>24){ ukazat("bnErr", t.errHours); return; }

  ls(K.kdo, z.pracovnik); ls(K.stavba, z.stavba);

  const b = $("send"); b.disabled = true; b.textContent = t.sending;
  let zprava = "";
  try{
    await poslat(z);
    zprava = z.stavba + " · " + z.prace + " · " + String(h).replace(".",",") + " h";
    odeslatFrontu();
  }catch(e){
    const f = lsj(K.fronta) || []; f.push(z); lsj(K.fronta, f);
    zprava = t.queued;
    ukazFrontu();
  }finally{
    b.disabled = false; b.textContent = t.send;
  }
  $("doneInfo").textContent = zprava;
  $("formCard").classList.add("hide");
  $("doneCard").classList.remove("hide");
  window.scrollTo({top:0});
});

$("again").addEventListener("click", ()=>{
  // Druhá stavba téhož dne — člověk a datum zůstávají, zbytek se vyčistí.
  // Stavbu schválně NEpředvyplňujeme, aby nikdo omylem nezapsal tu samou dvakrát.
  $("stavba").value = "";
  $("prace").value = ""; $("hodiny").value = ""; $("pozn").value = "";
  $("doneCard").classList.add("hide");
  $("formCard").classList.remove("hide");
});
$("close").addEventListener("click", ()=>{
  $("prace").value = ""; $("hodiny").value = ""; $("pozn").value = "";
  $("doneCard").classList.add("hide");
  $("formCard").classList.remove("hide");
});

window.addEventListener("online", odeslatFrontu);

prelozit();
nacistCiselniky();
odeslatFrontu();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
